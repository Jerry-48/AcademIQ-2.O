<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AcademIQ Quiz Builder</title>
<style>
:root{--bg:#0a0f1e;--card:#111a33;--bd:rgba(255,255,255,.1);--tx:#e8ecf8;--dim:#93a0c4;--am:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,'Noto Sans Gujarati',sans-serif;padding:1.2rem;max-width:900px;margin:auto}
h1{font-size:1.4rem}textarea,input{width:100%;padding:.65rem .8rem;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
textarea{min-height:230px;font-family:ui-monospace,monospace;font-size:.88rem}
button{padding:.65rem 1.1rem;border:0;border-radius:8px;background:var(--am);color:#1a1200;font-weight:700;cursor:pointer;margin:.3rem .3rem .3rem 0}button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:1rem;margin:1rem 0}.dim{color:var(--dim);font-size:.85rem}
.q{border-bottom:1px solid var(--bd);padding:.6rem 0}.ok{color:#34d399;font-weight:700}.bad{color:#f87171}pre{white-space:pre-wrap;background:#0006;padding:.7rem;border-radius:8px}
</style></head><body>
<h1>🛠 AcademIQ Quiz Builder</h1>
<p class="dim">Paste questions in this format (one blank line between questions). Optional: add an <b>Exp:</b> line for an explanation.</p>
<pre>Question text?
A) option 1
B) option 2
C) option 3
D) option 4
Answer: B
Exp: (optional) why this is correct</pre>
<div class="card">
  <textarea id="txt" placeholder="Paste questions here…"></textarea>
  <button onclick="parse()">1. Generate preview</button>
  <label class="g"><span class="dim">To add to an existing quiz, choose its JSON file:</span> <input type="file" id="old" accept=".json"></label>
</div>
<div id="out"></div>
<script>
let bank = [];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseText(t) {
  const out = [], errs = [];
  t.split(/\n\s*\n/).forEach((b, i) => {
    const L = b.trim().split('\n').map(s => s.trim()).filter(Boolean); if (!L.length) return;
    const ansL = L.find(l => /^(ans|answer)\s*[:=]/i.test(l)), expL = L.find(l => /^exp\s*[:=]/i.test(l));
    const optL = L.filter(l => /^[A-D][).:]\s*\S/i.test(l));
    const qText = L.filter(l => l !== ansL && l !== expL && !optL.includes(l)).join(' ');
    const ans = ansL ? 'ABCD'.indexOf((ansL.split(/[:=]/)[1] || '').trim()[0]?.toUpperCase()) : -1;
    if (!qText || optL.length !== 4 || ans < 0) { errs.push(`Block ${i + 1}: invalid format (needs 4 options A–D and an Answer line) → "${L[0].slice(0, 50)}"`); return; }
    const q = { q: qText, opts: optL.map(l => l.replace(/^[A-D][).:]\s*/i, '')), ans };
    if (expL) q.exp = expL.replace(/^exp\s*[:=]\s*/i, ''); out.push(q);
  });
  return { out, errs };
}
async function parse() {
  const { out, errs } = parseText($('txt').value);
  let base = [];
  const f = $('old').files[0];
  if (f) { try { base = JSON.parse(await f.text()); if (!Array.isArray(base)) throw 0; } catch (e) { alert('The selected file is not a valid quiz JSON array'); return; } }
  bank = [...base, ...out];
  const seen = {}, dups = [];
  bank.forEach((q, i) => { const k = q.q.toLowerCase().replace(/\s+/g, ' '); if (seen[k] !== undefined) dups.push(i + 1); else seen[k] = i; });
  $('out').innerHTML = `<div class="card"><b>${bank.length}</b> questions (${base.length} existing + ${out.length} new)
    ${errs.length ? `<p class="bad">${errs.map(esc).join('<br>')}</p>` : ''}
    ${dups.length ? `<p class="bad">⚠️ Duplicate questions: #${dups.join(', #')} (remove them and try again)</p>` : ''}
    <p class="dim">In each question, the <span class="ok">green</span> option is the correct answer. Please review carefully.</p>
    ${bank.map((q, i) => `<div class="q"><b>${i + 1}. ${esc(q.q)}</b><br>${q.opts.map((o, j) => `<span class="${j === q.ans ? 'ok' : ''}">${'ABCD'[j]}) ${esc(o)}</span>`).join(' &nbsp; ')}${q.exp ? `<br><span class="dim">💡 ${esc(q.exp)}</span>` : ''}</div>`).join('')}
    <p>Filename: <input id="fn" value="ddcet.json" style="max-width:260px"></p>
    <button onclick="dl()">⬇ Download JSON</button></div>`;
}
function dl() {
  const name = ($('fn').value.trim() || 'quiz.json').replace(/[^\w.-]/g, '-');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(bank, null, 1)], { type: 'application/json' }));
  a.download = name.endsWith('.json') ? name : name + '.json'; a.click();
}
</script></body></html>
